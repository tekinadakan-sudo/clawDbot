# XcodeGen fallback for ios/Kilit.xcodeproj (DESIGN.md §6).
#
# Use ONLY if the hand-written Kilit.xcodeproj will not open:
#   brew install xcodegen && cd ios && xcodegen generate
#
# Requires XcodeGen >= 2.45.4 (syncedFolder sources, projectFormat xcode16_0 = objectVersion 77).
# `xcodegen generate` OVERWRITES Kilit.xcodeproj including the shared scheme (new object ids),
# so the hand-written project and this file are mutually exclusive workflows; never mix them.
name: Kilit
options:
  bundleIdPrefix: com.tekinadakan
  developmentLanguage: tr
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  projectFormat: xcode16_0
  createIntermediateGroups: false
  generateEmptyDirectories: false
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    LOCALIZATION_PREFERS_STRING_CATALOGS: "YES"
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "YES"
  configs:
    Debug:
      ENABLE_TESTABILITY: "YES"
targets:
  Kilit:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Kilit/Sources
        type: syncedFolder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tekinadakan.kilit
        PRODUCT_NAME: "$(TARGET_NAME)"
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGN_ENTITLEMENTS: Kilit/Kilit.entitlements
        INFOPLIST_KEY_NSCameraUsageDescription: "Kilit, korumalı sohbetlerde göndereceğin fotoğrafları çekmek için kamerayı kullanır."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Kilit, korumalı sohbetlerin kilidini açmak için Face ID kullanır."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Kilit yalnızca göndermek için seçtiğin fotoğrafları okur; fotoğraflar cihazdan çıkmadan şifrelenir."
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
        SWIFT_EMIT_LOC_STRINGS: "YES"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/Frameworks"]
      configs:
        Debug:
          INFOPLIST_FILE: Kilit/Info-Debug.plist
        Release:
          INFOPLIST_FILE: Kilit/Info-Release.plist
    scheme:
      testTargets:
        - KilitTests
      gatherCoverageData: false
  KilitTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Kilit/Tests
        type: syncedFolder
    dependencies:
      - target: Kilit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tekinadakan.kilit.tests
        PRODUCT_NAME: "$(TARGET_NAME)"
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_EMIT_LOC_STRINGS: "NO"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
