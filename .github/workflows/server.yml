# Server CI (DESIGN.md §4.10 / §8 WP4): vet, tests without cgo (the shipping configuration),
# the race detector with cgo, the vectors golden check and a static build with the version baked in.
name: server

on:
  push:
    branches: ["**"]
    paths:
      - "server/**"
      - "docs/vectors/**"
      - "ios/Kilit/Tests/Vectors/**"
      - ".github/workflows/server.yml"
  pull_request:
    paths:
      - "server/**"
      - "docs/vectors/**"
      - "ios/Kilit/Tests/Vectors/**"
      - ".github/workflows/server.yml"

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

defaults:
  run:
    working-directory: server

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
          check-latest: false

      - name: Download pinned modules
        run: go mod download

      - name: go.sum matches the pinned modules
        run: go mod verify

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: go vet
        run: go vet ./...

      - name: go test (CGO_ENABLED=0)
        env:
          CGO_ENABLED: "0"
        run: go test ./...

      - name: go test -race (CGO_ENABLED=1)
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...

      - name: vectors golden test
        env:
          CGO_ENABLED: "0"
        run: |
          go test ./cmd/vectors/... ./pkg/kilitcrypto/...
          go run ./cmd/vectors -out ../docs/vectors -swift ../ios/Kilit/Tests/Vectors
          git diff --exit-code -- ../docs/vectors ../ios/Kilit/Tests/Vectors

      - name: static build
        env:
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_SHA::12}" -o kilitd ./cmd/kilitd
          file kilitd
          ./kilitd -h 2>&1 | head -3 || true
