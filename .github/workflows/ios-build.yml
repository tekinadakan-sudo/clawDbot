# Builds the iOS app and runs the KilitTests unit tests on a GitHub-hosted
# macOS runner (Xcode 16, iOS Simulator). Simulator builds need no signing.
name: ios-build

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devs = json.load(sys.stdin)["devices"]
          best = None
          for runtime, items in devs.items():
              if "iOS" not in runtime:
                  continue
              for d in items:
                  if d.get("isAvailable") and d["name"].startswith("iPhone"):
                      key = (runtime, d["name"])
                      if best is None or key > best[0]:
                          best = (key, d["udid"])
          print(best[1] if best else "")
          ')
          echo "Using simulator $UDID"
          xcrun simctl list devices | grep "$UDID" || true
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project ios/Kilit.xcodeproj -scheme Kilit \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log | grep -E "error:|warning: .*(isolat|Sendable)|BUILD (SUCCEEDED|FAILED)|TEST BUILD" || true
          grep -q "TEST BUILD SUCCEEDED\|BUILD SUCCEEDED" build.log

      - name: Compiler errors (if any)
        if: failure()
        run: |
          echo "=== unique compiler errors ==="
          grep -E "^/.*: error: " build.log | sed "s|$GITHUB_WORKSPACE/||" | sort -u | head -300 || true
          echo "=== other failures ==="
          grep -E "error:|fatal" build.log | grep -v "^/.*: error: " | sort -u | head -80 || true

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project ios/Kilit.xcodeproj -scheme Kilit \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/KilitTests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee test.log | grep -E "Test Case .* (failed|passed)|error:|Executed|TEST (SUCCEEDED|FAILED)" || true
          grep -q "TEST SUCCEEDED\|TEST EXECUTE SUCCEEDED" test.log

      - name: Test failures (if any)
        if: failure()
        run: |
          echo "=== failing tests ==="
          grep -E "error: -\[|: error: .*XCT|Test Case .* failed" test.log 2>/dev/null | sed "s|$GITHUB_WORKSPACE/||" | sort -u | head -300 || true

      - name: Upload logs and result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: |
            build.log
            test.log
            build/KilitTests.xcresult
          if-no-files-found: ignore
          retention-days: 7
